name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Check directory structure
        run: |
          echo "=== Repository structure ==="
          ls -la
          echo "=== apps/web directory ==="
          ls -la apps/web || echo "apps/web not found"

      - name: Install dependencies
        working-directory: apps/web
        run: |
          echo "=== Installing dependencies ==="
          npm ci || npm install
          echo "=== Dependency installation complete ==="

      - name: Build Next.js app
        working-directory: apps/web
        run: |
          echo "=== Building Next.js app ==="
          npm run build
          echo "=== Build complete ==="
          ls -la out/ || echo "out directory not found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Add Android platform
        working-directory: apps/web
        run: |
          echo "=== Adding Android platform ==="
          npx cap add android || echo "Android platform already exists"
          echo "=== Checking android directory ==="
          ls -la android/ || echo "android directory not found"

      - name: Sync Capacitor
        working-directory: apps/web
        run: |
          echo "=== Syncing Capacitor ==="
          npx cap sync android
          echo "=== Capacitor sync complete ==="

      - name: Grant execute permission for gradlew
        working-directory: apps/web/android
        run: |
          echo "=== Setting gradlew permissions ==="
          chmod +x gradlew
          ls -la gradlew

      - name: Build Debug APK
        working-directory: apps/web/android
        run: |
          echo "=== Building Debug APK ==="
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== APK build complete ==="

      - name: List APK files
        run: find apps/web/android/app/build/outputs -name "*.apk" || echo "No APK found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReviseSnap-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (optional)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ReviseSnap v1.0.${{ github.run_number }}
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
